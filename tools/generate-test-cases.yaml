name: generate-test-cases
description: Generate deterministic structured test case proposals from Python source.
version: 1.0.0
input_schema:
  type: object
  properties:
    source: {type: string, minLength: 1}
    language: {type: string, enum: [python]}
    max_cases: {type: integer, minimum: 1, maximum: 100}
    focus: {type: string, minLength: 1}
  required: [source, language]
output_schema:
  type: object
implementation:
  type: script
  path: tools/generate-test-cases.py
  runtime: python3
